# Save as .github/workflows/deploy.yml in getvalley/Messages
# Put sutra-site.zip in the repo root. Every push that changes the zip rebuilds the site.
# One-time setup: Settings > Pages > Source: "GitHub Actions".
name: Deploy Sutra site

on:
  push:
    branches: [main]
    paths:
      - "sutra-site.zip"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # lets deploy-pages list the uploaded artifact (matters in private repos)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the site
        run: |
          set -e
          test -f sutra-site.zip || { echo "sutra-site.zip not found in repo root"; exit 1; }
          rm -rf _site && mkdir -p _site
          unzip -o sutra-site.zip -d _site
          # If the zip wraps everything in one folder, move its contents up
          if [ ! -f _site/index.html ] && [ "$(ls -1 _site | wc -l)" -eq 1 ] && [ -d "_site/$(ls -1 _site)" ]; then
            d="_site/$(ls -1 _site)"
            mv "$d"/* _site/
            rmdir "$d"
          fi
          test -f _site/index.html || { echo "index.html missing after unzip"; exit 1; }
          ls -la _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site


  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
